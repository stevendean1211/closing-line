name: Refresh odds and rebuild

# Odds go stale fast. This pulls fresh numbers and rebuilds so the board isn't
# showing yesterday's prices. Cloudflare Pages redeploys automatically on push.
on:
  schedule:
    - cron: '0 */6 * * *'      # every 6 hours
    - cron: '*/20 22-23 * * 6' # every 20 min Saturday night — main card window (UTC)
  push:
    paths: ['data/picks/**']    # rebuild immediately when a pick is logged
  workflow_dispatch:            # manual trigger button

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch odds
        env:
          # no key needed for cards
          ODDS_PROVIDER: ${{ vars.ODDS_PROVIDER || 'theoddsapi' }}
        run: node fetch-card.js

      - name: Build
        run: node build.js

      - name: Commit refreshed cache
        run: |
          git config user.name "odds-bot"
          git config user.email "actions@github.com"
          git add data/card-cache.json dist/
          git diff --staged --quiet || git commit -m "chore: refresh odds [skip ci]"
          git push

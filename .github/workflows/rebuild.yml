name: Refresh cards

# ESPN blocks datacenter IPs at the edge, so the Cloudflare Function can't be
# relied on for the data. This Action fetches on a schedule and commits the
# cache; Cloudflare then builds a fully static site from it. The Function still
# tries a live refresh, and simply does nothing when it can't.
on:
  schedule:
    - cron: '0 */6 * * *'       # every 6 hours
    - cron: '*/30 20-23 * * 6'  # every 30 min, Saturday night (UTC) — fight window
    - cron: '*/30 0-4 * * 0'    # and into Sunday morning
  push:
    paths: ['data/picks/**', 'data/premium/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Fetch cards from ESPN
        run: node fetch-card.js

      - name: Build
        run: node build.js

      - name: Commit refreshed cache
        run: |
          git config user.name "card-bot"
          git config user.email "actions@github.com"
          git add data/card-cache.json functions/api/espn-lib.js
          git diff --staged --quiet || git commit -m "chore: refresh cards [skip ci]"
          git push
